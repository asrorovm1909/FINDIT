
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPILDI — Потерянные и найденные вещи</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>

<header class="header">
  <a href="#" class="logo">TOPILDI<span>.</span></a>

  <div class="language">
    <button class="lang-btn active" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="uz">UZ</button>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1 data-i18n="heroTitle">Потерял? Найди.</h1>
    <p data-i18n="heroText">Помогаем людям находить потерянные вещи.</p>
  </section>

  <!-- АВТОРИЗАЦИЯ -->
  <section id="authSection" class="panel">
    <h2 id="authTitle" data-i18n="loginTitle">Вход</h2>

    <div class="tabs">
      <button id="showLogin" class="tab-btn active" data-i18n="login">Войти</button>
      <button id="showRegister" class="tab-btn" data-i18n="register">Регистрация</button>
    </div>

    <form id="authForm">
      <input
        id="authEmail"
        type="email"
        placeholder="Gmail"
        data-i18n-placeholder="emailPlaceholder"
        required
      >

      <input
        id="authPassword"
        type="password"
        placeholder="Пароль"
        data-i18n-placeholder="passwordPlaceholder"
        minlength="6"
        required
      >

      <small id="passwordHint" data-i18n="passwordHint">
        Минимум 6 символов
      </small>

      <button type="submit" id="authSubmit" class="primary-btn" data-i18n="login">
        Войти
      </button>
    </form>

    <p id="authMessage" class="message"></p>
  </section>

  <!-- ПОДТВЕРЖДЕНИЕ EMAIL -->
  <section id="verifySection" class="panel hidden">
    <h2 data-i18n="verifyTitle">Подтверждение email</h2>

    <p data-i18n="verifyText">Введите шестизначный код из письма.</p>

    <form id="verifyForm">
      <input id="verifyEmail" type="email" readonly>

      <input
        id="verifyCode"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="6-значный код"
        data-i18n-placeholder="codePlaceholder"
        required
      >

      <button type="submit" class="primary-btn" data-i18n="confirm">
        Подтвердить
      </button>
    </form>

    <button id="resendCode" class="secondary-btn" data-i18n="resend">
      Отправить код повторно
    </button>

    <button id="backToAuth" class="text-btn" data-i18n="back">
      Назад
    </button>

    <p id="verifyMessage" class="message"></p>
  </section>

  <!-- ЛИЧНЫЙ КАБИНЕТ -->
  <section id="loggedSection" class="hidden">

    <div class="account-bar">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="secondary-btn" data-i18n="logout">Выйти</button>
    </div>

    <section class="panel">
      <h2 data-i18n="publishTitle">Опубликовать объявление</h2>

      <form id="listingForm">

        <select id="listingType" required>
          <option value="lost" data-i18n="lost">Потерял</option>
          <option value="found" data-i18n="found">Нашёл</option>
        </select>

        <select id="listingCategory" required>
          <option value="" data-i18n="chooseCategory">Выберите категорию</option>
          <option value="Электроника" data-i18n="electronics">Электроника</option>
          <option value="Документы" data-i18n="documents">Документы</option>
          <option value="Одежда" data-i18n="clothes">Одежда</option>
          <option value="Ключи" data-i18n="keys">Ключи</option>
          <option value="Животные" data-i18n="animals">Животные</option>
          <option value="Другое" data-i18n="other">Другое</option>
        </select>

        <input id="listingTitle" type="text"
          placeholder="Название вещи"
          data-i18n-placeholder="titlePlaceholder" required>

        <textarea id="listingDescription"
          placeholder="Описание"
          data-i18n-placeholder="descriptionPlaceholder" required></textarea>

        <input id="listingLocation" type="text"
          placeholder="Где потеряли или нашли?"
          data-i18n-placeholder="locationPlaceholder" required>

        <input id="listingContact" type="text"
          placeholder="Ваш номер телефона или Telegram"
          data-i18n-placeholder="contactPlaceholder" required>

        <label for="listingImage" data-i18n="photoLabel">Фотография (необязательно)</label>
        <input id="listingImage" type="file" accept="image/*">

        <button type="submit" id="publishBtn" class="primary-btn" data-i18n="publish">
          Опубликовать
        </button>

      </form>

      <p id="listingMessage" class="message"></p>
    </section>

    <!-- ПОИСК -->
    <section class="panel">
      <h2 data-i18n="searchTitle">Объявления</h2>

      <input id="searchInput" type="search"
        placeholder="Поиск..."
        data-i18n-placeholder="searchPlaceholder">

      <div class="filters">
        <select id="filterType">
          <option value="all" data-i18n="allTypes">Все объявления</option>
          <option value="lost" data-i18n="lost">Потерял</option>
          <option value="found" data-i18n="found">Нашёл</option>
        </select>

        <select id="filterCategory">
          <option value="all" data-i18n="allCategories">Все категории</option>
          <option value="Электроника" data-i18n="electronics">Электроника</option>
          <option value="Документы" data-i18n="documents">Документы</option>
          <option value="Одежда" data-i18n="clothes">Одежда</option>
          <option value="Ключи" data-i18n="keys">Ключи</option>
          <option value="Животные" data-i18n="animals">Животные</option>
          <option value="Другое" data-i18n="other">Другое</option>
        </select>
      </div>

      <div id="listingsGrid" class="listings-grid"></div>
    </section>

  </section>

</main>

<footer>
  <p>TOPILDI © 2026</p>
</footer>

</body>
</html>
